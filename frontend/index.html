<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioLicensing · Give research a future.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#15131b" />
    <script>
      // Apply the stored theme before the first paint (dark by default).
      try {
        var theme = localStorage.getItem("biolicensing.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <meta name="description" content="Fund European research one patent at a time: licences funded in EURC, released by milestones, with automatic royalties on Stellar." />
    <!-- Link previews (Discord, Slack, X, LinkedIn…). Crawlers do not run JS, so these stay static. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BioLicensing" />
    <meta property="og:title" content="BioLicensing · Give research a future." />
    <meta property="og:description" content="University patent licences funded in EURC, released by milestones, with royalties shared automatically on Stellar. Live testnet demo." />
    <meta property="og:url" content="https://biolicensing.vercel.app/" />
    <meta property="og:image" content="https://biolicensing.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
