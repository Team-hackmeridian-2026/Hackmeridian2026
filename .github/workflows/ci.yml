name: CI

# Runs on every pull request and on main, so a broken contract test, type error
# or missing translation is caught before review instead of after the merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# On a pull request, a new push replaces the run of the previous one. On main, every
# merge keeps its own run: merging several PRs in a row must not cancel the checks
# of the earlier merges.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Unit tests
        run: cargo test --locked
      - name: Install the Stellar CLI
        uses: stellar/stellar-cli@v28.1.0
      - name: Build the Wasm contracts
        # soroban-sdk only builds contracts through `stellar contract build`.
        run: stellar contract build

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Dependabot writes package-lock.json with npm 11; the npm 10 bundled with
      # Node 22 rejects those lockfiles in `npm ci` (optional peer dependencies).
      - name: Use npm 11
        run: npm install -g npm@11
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Translations (EN / FR / PT)
        run: npm run test:i18n
